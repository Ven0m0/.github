# Python UV Lock & Autofix Workflow (Reusable)
name: Python UV Autofix (Reusable)

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  branches: [main, master]
  push:
  branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  DEBIAN_FRONTEND: noninteractive
  LC_ALL: C
  UV_FORK_STRATEGY: requires-python
  UV_RESOLUTION: highest
  UV_PRERELEASE: if-necessary-or-explicit
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_NATIVE_TLS: 0
  UV_NO_PROGRESS: 1

jobs:
  autofix:
  name: Python UV Autofix
  runs-on: ubuntu-slim
  timeout-minutes: 15
  steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

    - name: Check for Python Dependencies
      id: check_files
      run: |
        if [[ -f "requirements.txt" || -f "pyproject.toml" || -f "uv.lock" ]]; then
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          echo "Python dependency files found."
        else
          echo "has_files=false" >> "$GITHUB_OUTPUT"
          echo "No Python dependency files found."
        fi
      shell: bash

    - name: Setup UV
      if: steps.check_files.outputs.has_files == 'true'
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
      with:
        python-version: "3.13"
        activate-environment: "true"
        github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        cache-python: "true"
        resolution-strategy: "highest"

    - name: Install Dependencies
      if: steps.check_files.outputs.has_files == 'true'
      run: |
        uv pip install pip
        if [[ -f "requirements.txt" ]]; then
          uv pip install -r requirements.txt
        fi

    - name: Update Lock File
      if: steps.check_files.outputs.has_files == 'true'
      run: uv lock -U --fork-strategy requires-python --index-strategy unsafe-best-match --resolution highest

    - name: Lint with Ruff
      if: steps.check_files.outputs.has_files == 'true'
      uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3

    - name: Fix Lint Issues
      if: steps.check_files.outputs.has_files == 'true'
      run: ruff check --fix-only

    - name: Format Code
      if: steps.check_files.outputs.has_files == 'true'
      run: ruff format

    - name: Run Autofix
      if: steps.check_files.outputs.has_files == 'true'
      uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8 # v1.3.3
      with:
        github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
