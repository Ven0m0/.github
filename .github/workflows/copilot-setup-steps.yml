name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEBCONF_NOWARNINGS: yes
  DEBIAN_FRONTEND: "noninteractive"
  NODE_ENV: "production"
  PYTHONOPTIMIZE: 1
  RUSTC_LOG: "off"
  PYTHONDONTWRITEBYTECODE: 1
jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    # Set permissions to the lowest needed. Copilot gets its own token for operations
    permissions:
      contents: write
      actions: write
      issues: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Git config
        run: |
          git config --global diff.suppressBlankEmpty true
          git config --global diff.algorithm histogram
          git config --global merge.conflictStyle zdiff3
          git config --global status.short true
      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -q; sudo apt-get install -yq --no-install-recommends ripgrep fd shellcheck shfmt || :
          uv venv && source .venv/bin/activate
          echo 'export PATH="$HOME/.local/bin:$PATH"' | tee -a ~/.bashrc ~/.profile >/dev/null 2>&1
          uv tool install ruff &
          uv tool install git+https://github.com/oraios/serena >/dev/null 
          uv pip install code-graph-mcp ast-grep-py rustworkx pyright >/dev/null
          bun i -g @biomejs/biome @ast-grep/cli bash-language-server yaml-language-server zon-format >/dev/null || :
          bun pm -g trust --all >/dev/null 2>&1 & || :
          curl -fsSL https://raw.githubusercontent.com/mattzcarey/zagi/main/install.sh | bash >/dev/null 2>&1 || :; wait
      - name: Index codebase
        run: |
          uvx --from git+https://github.com/oraios/serena serena project index --language bash --language python --language yaml \
            --language markdown --language typescript --language rust --language toml >/dev/null 2>&1 || :
