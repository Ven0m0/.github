name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

env:
  PYTHONOPTIMIZE: "1"
  LC_ALL: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  UV_NO_PROGRESS: "1"
  UV_FORK_STRATEGY: requires-python
  UV_RESOLUTION: highest
  UV_PRERELEASE: if-necessary-or-explicit
  GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
  NODE_ENV: production
  BUN_INSTALL_CACHE_DIR: ~/.bun/install/cache

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT || github.token }}

      - name: Check for Bun dependencies
        id: check_files
        run: |
          if [[ -f package.json || -f bun.lockb ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ripgrep fd-find jq tmux

      - uses: actions/setup-node@v4
        with:
          node-version: "25"

      - uses: oven-sh/setup-bun@v2

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Cache Bun dependencies
        if: steps.check_files.outputs.has_files == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install project dependencies
        if: steps.check_files.outputs.has_files == 'true'
        run: bun install --frozen-lockfile

      - name: Setup Python toolchain
        run: |
          uv python install
          uv venv
          uv tool install ruff@latest
          uv pip install \
            basedpyright \
            zon-format \
            claudelint

      - name: Setup Node toolchain
        run: |
          bun add -g --trust \
            @biomejs/biome \
            repomix \
            @toon-format/cli \
            @toon-format/toon \
            zon-format \
            @mixedbread/mgrep

      - name: Install zagi
        run: curl -fsSL zagi.sh/install | bash
