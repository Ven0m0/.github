name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  NODE_ENV: production
  NODE_OPTIONS: "--disable-warning --max-old-space-size=2048"
  BUN_OPTIONS: "--bun --prefer-offline --parallel --silent --no-exit-on-error --smol"
  NODE_NO_WARNINGS: 1
  NODE_SKIP_PLATFORM_CHECK: 1
  DEBIAN_FRONTEND: "noninteractive"
  DEBCONF_NOWARNINGS: "yes"
  PYTHONHASHSEED: 0
  PYTHONOPTIMIZE: 1
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  DO_NOT_TRACK: 1

defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen || uv python install 3.14
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with: 
          node-version: "25"
          cache: "bun"
      - run: bun install --frozen-lockfile
      - name: bash
        run: |
          git config --global --add safe.directory "$(realpath .)"
          git config --global index.version 4
          git config --global index.threads 0
          git config --global http.version "HTTP/2"
          git config --global protocol.version 2
          git config --global core.compression 9
          git config --global core.preloadindex true
          git config --global diff.context 3
          git config --global diff.suppressBlankEmpty true
          git config --global diff.compactionHeuristic true
          git config --global diff.ignoreSubmodules true
          git config --global diff.algorithm histogram
          git config --global merge.conflictStyle zdiff3
          git config --global fetch.parallel 0
          git config --global pack.threads 0
          git config --global status.short true
          git config --global commit.verbose false
          git config --global feature.manyFiles true
      #- name: Index serena
        #run: uvx --from git+https://github.com/oraios/serena serena project index
