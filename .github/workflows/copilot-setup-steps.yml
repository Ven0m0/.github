name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

env:
  PYTHONOPTIMIZE: 1
  LC_ALL: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  UV_SYSTEM_PYTHON: 1
  UV_NO_PROGRESS: 1
  GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
  NODE_ENV: production
  DO_NOT_TRACK: 1
  NO_COLOR: 1
  BUN_OPTIONS: --bun --silent --prefer-offline
  BUN_INSTALL_CACHE_DIR: ~/.bun/install/cache

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.PAT || github.token }}

      - name: Check for Bun dependencies
        id: check_files
        run: |
          [[ -f package.json || -f bun.lockb ]] \
            && echo "has_files=true" >> "$GITHUB_OUTPUT" \
            || echo "has_files=false" >> "$GITHUB_OUTPUT"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ripgrep fd-find jq tmux rust-analyzer uv

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: "25"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: latest
          token: ${{ secrets.PAT || github.token }}
      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          enable-cache: true
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Cache Bun dependencies
        if: steps.check_files.outputs.has_files == 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install project dependencies
        if: steps.check_files.outputs.has_files == 'true'
        run: bun install --frozen-lockfile

      - name: Setup toolchains (parallel)
        run: |
          uv python install && uv venv
          uv tool install ruff@latest
          uv pip install \
            basedpyright \
            zon-format \
            mcp \
            claudelint \
            files-to-prompt \
            toon-llm
          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash || npm install -g bun
          fi
          if command -v bun >/dev/null 2>&1; then
            bun install -g \
            @biomejs/biome \
            @toon-format/cli \
            @toon-format/toon \
            claude-praetorian-mcp \
            zon-format \
            @ast-grep/cli \
            bash-language-server \
            typescript \
            @vtsls/language-server \
            vscode-langservers-extracted \
            yaml-language-server
          else
            npm install -g \
            @biomejs/biome \
            @toon-format/cli \
            @toon-format/toon \
            claude-praetorian-mcp \
            zon-format \
            @ast-grep/cli \
            bash-language-server \
            typescript \
            @vtsls/language-server \
            vscode-langservers-extracted \
            yaml-language-server
          fi
          # marksman (Markdown LSP) — no apt package
          (
            curl -fsSL -o /tmp/marksman \
              https://github.com/artempyanykh/marksman/releases/latest/download/marksman-linux-x64 \
              && sudo install -m755 /tmp/marksman /usr/local/bin/
          ) &
          wait

      - name: Verify tools
        run: |
          fail=0
          for cmd in \
            bash-language-server \
            vtsls \
            vscode-html-language-server \
            vscode-json-language-server \
            yaml-language-server \
            rust-analyzer \
            marksman \
            basedpyright \
            ast-grep \
            ruff \
            biome \
            repomix \
            files-to-prompt; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "ok $cmd"
            else
              echo "FAIL $cmd" >&2
              fail=1
            fi
          done
          exit "$fail"
      - name: Install zagi
        run: curl -fsSL zagi.sh/install | bash

      - name: Minimize uv cache
        run: uv cache prune --ci
      
