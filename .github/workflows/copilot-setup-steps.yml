name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]
env:
  PYTHONOPTIMIZE: 1
  LC_ALL: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  UV_SYSTEM_PYTHON: 1
  UV_NO_PROGRESS: 1
  GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
  NODE_ENV: production
  DO_NOT_TRACK: 1
  NO_COLOR: 1
  BUN_OPTIONS: --bun --silent --prefer-offline
  BUN_INSTALL_CACHE_DIR: ~/.bun/install/cache
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT || github.token }}
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ripgrep fd-find
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          token: ${{ secrets.PAT || github.token }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - name: Cache Bun dependencies
        if: steps.check_files.outputs.has_files == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Setup toolchains (parallel)
        run: |
          uv venv
          uv pip install \
            zon-format \
            toon-llm
          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash || npm install -g bun
          fi
          if command -v bun >/dev/null 2>&1; then
            bun install -g \
              @toon-format/cli \
              zon-format \
              @ast-grep/cli \
          else
            npm install -g \
              @toon-format/cli \
              zon-format \
              @ast-grep/cli \
          fi
      - name: Install zagi
        run: curl -fsSL zagi.sh/install | bash
      - name: Minimize uv cache
        run: uv cache prune --ci
      
