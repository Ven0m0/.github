name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

env:
  PYTHONOPTIMIZE: "1"
  LC_ALL: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  UV_NO_PROGRESS: "1"
  UV_FORK_STRATEGY: requires-python
  UV_RESOLUTION: highest
  UV_PRERELEASE: if-necessary-or-explicit
  GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
  NODE_ENV: production
  BUN_INSTALL_CACHE_DIR: ~/.bun/install/cache

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT || github.token }}

      - name: Check for Bun dependencies
        id: check_files
        run: |
          [[ -f package.json || -f bun.lockb ]] \
            && echo "has_files=true" >> "$GITHUB_OUTPUT" \
            || echo "has_files=false" >> "$GITHUB_OUTPUT"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ripgrep fd-find jq tmux rust-analyzer uv

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Cache Bun dependencies
        if: steps.check_files.outputs.has_files == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install project dependencies
        if: steps.check_files.outputs.has_files == 'true'
        run: bun install --frozen-lockfile

      - name: Setup toolchains (parallel)
        run: |
          uv python install && uv venv
          uv tool install ruff@latest beads-mcp
          uv pip install \
            basedpyright \
            zon-format \
            mcp \
            claudelint \
            files-to-prompt \
            toon-llm
          npm install -g \
            @biomejs/biome \
            repomix \
            @toon-format/cli \
            @toon-format/toon \
            claude-praetorian-mcp \
            zon-format \
            @ast-grep/cli \
            bash-language-server \
            typescript \
            @vtsls/language-server \
            vscode-langservers-extracted \
            yaml-language-server
          # marksman (Markdown LSP) — no apt package
          (
            curl -fsSL -o /tmp/marksman \
              https://github.com/artempyanykh/marksman/releases/latest/download/marksman-linux-x64 \
              && sudo install -m755 /tmp/marksman /usr/local/bin/
          ) &
          wait

      - name: Verify tools
        run: |
          fail=0
          for cmd in \
            bash-language-server \
            vtsls \
            vscode-html-language-server \
            vscode-json-language-server \
            yaml-language-server \
            rust-analyzer \
            marksman \
            basedpyright \
            ast-grep \
            ruff \
            biome \
            repomix \
            files-to-prompt; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "ok $cmd"
            else
              echo "FAIL $cmd" >&2
              fail=1
            fi
          done
          exit "$fail"
      - name: Install zagi
        run: curl -fsSL zagi.sh/install | bash
