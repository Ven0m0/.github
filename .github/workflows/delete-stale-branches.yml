name: Delete stale branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branches=(
            "copilot/auto-commit-files"
            "copilot/auto-commit-files-again"
            "copilot/resolve-todos-fixmes"
          )
          for branch in "${branches[@]}"; do
            if gh api "/repos/${GH_REPO}/git/refs/heads/${branch//\//%2F}" &>/dev/null 2>&1; then
              gh api --method DELETE "/repos/${GH_REPO}/git/refs/heads/${branch//\//%2F}"
              echo "Deleted: $branch"
            else
              echo "Already gone: $branch"
            fi
          done
