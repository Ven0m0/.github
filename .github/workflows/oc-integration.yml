name: oc integration
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.ANTHROPIC_API_KEY }}
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          # https://openrouter.ai/docs/guides/routing/model-variants/online
          # :thinking:online | :extended:online | :nitro:online | :extended:online
          model: openrouter/auto:exacto:online
          use_github_token: true
