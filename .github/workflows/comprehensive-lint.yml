# Comprehensive Linting Workflow (Reusable)
name: Comprehensive Lint (Reusable)
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
        description: "Working directory for the workflow"
      apply-shellharden:
        type: boolean
        default: true
        description: "Apply shellharden fixes to shell scripts"
      shfmt-indent:
        type: number
        default: 2
        description: "Indentation size for shfmt (reserved for compatibility)"
      shell-exclude-pattern:
        type: string
        default: '(^|/)\\.(git|cache|claude|venv)(/|$)'
        description: "Pattern to exclude shell files from processing"
      megalinter-validate-all:
        type: boolean
        default: false
        description: "Validate all files or only changed files"
      megalinter-config:
        type: string
        default: ".megalinter.yml"
        description: "Path to MegaLinter configuration file"
      megalinter-exclude-dirs:
        type: string
        default: ".github,.git,.cache,node_modules"
        description: "Directories to exclude from MegaLinter"
      commit-fixes:
        type: boolean
        default: true
        description: "Automatically commit fixes"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
env:
  DEBIAN_FRONTEND: noninteractive
jobs:
  megalinter:
    name: Comprehensive Lint
    runs-on: ubuntu-latest
    # Shellharden and MegaLinter now run serially inside one composite action.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Run comprehensive lint action
        uses: ./actions/comprehensive-lint
        with:
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          working-directory: ${{ inputs.working-directory }}
          apply-shellharden: ${{ inputs.apply-shellharden }}
          shfmt-indent: ${{ inputs.shfmt-indent }}
          is-same-repo-pull-request: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          shell-exclude-pattern: ${{ inputs.shell-exclude-pattern }}
          megalinter-validate-all: ${{ inputs.megalinter-validate-all }}
          megalinter-config: ${{ inputs.megalinter-config }}
          megalinter-exclude-dirs: ${{ inputs.megalinter-exclude-dirs }}
          commit-fixes: ${{ inputs.commit-fixes }}
