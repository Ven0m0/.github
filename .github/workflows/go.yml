# Reusable Go CI Workflow
# Runs lint, test, and optional coverage

name: Go CI

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version"
        required: false
        type: string
        default: "1.22"
      golangci_version:
        description: "golangci-lint version"
        required: false
        type: string
        default: "v1.59"
      coverage:
        description: "Enable code coverage"
        required: false
        type: boolean
        default: false
      coverage_threshold:
        description: "Minimum coverage percentage"
        required: false
        type: number
        default: 80
      working_directory:
        description: "Working directory"
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'gofmt -w .'"
            gofmt -d .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ inputs.golangci_version }}
          working-directory: ${{ inputs.working_directory }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Run tests
        run: go test -v -race -shuffle=on ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: lint
    if: inputs.coverage
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < ${{ inputs.coverage_threshold }}" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${{ inputs.coverage_threshold }}%"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ${{ inputs.working_directory }}/coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Build
        run: go build -v ./...

      - name: Summary
        run: |
          {
            echo "## Go Build Summary"
            echo ""
            echo "- Go version: ${{ inputs.go_version }}"
            echo "- golangci-lint: ${{ inputs.golangci_version }}"
            echo "- All checks passed"
          } >> "$GITHUB_STEP_SUMMARY"
