# Reusable Rust CI Workflow
# Runs fmt, clippy, test, and optional coverage

name: Rust CI

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain version"
        required: false
        type: string
        default: "stable"
      components:
        description: "Additional rustup components"
        required: false
        type: string
        default: "rustfmt, clippy"
      features:
        description: "Cargo features to enable"
        required: false
        type: string
        default: ""
      coverage:
        description: "Enable code coverage"
        required: false
        type: boolean
        default: false
      deny:
        description: "Run cargo-deny checks"
        required: false
        type: boolean
        default: true
      working_directory:
        description: "Working directory"
        required: false
        type: string
        default: "."

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: ${{ inputs.components }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working_directory }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          FEATURES="${{ inputs.features }}"
          if [[ -n "$FEATURES" ]]; then
            cargo clippy --all-targets --features "$FEATURES" -- -D warnings
          else
            cargo clippy --all-targets -- -D warnings
          fi

      - name: Check
        run: |
          FEATURES="${{ inputs.features }}"
          if [[ -n "$FEATURES" ]]; then
            cargo check --all-targets --features "$FEATURES"
          else
            cargo check --all-targets
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working_directory }}

      - name: Run tests
        run: |
          FEATURES="${{ inputs.features }}"
          if [[ -n "$FEATURES" ]]; then
            cargo test --all-targets --features "$FEATURES"
          else
            cargo test --all-targets
          fi

      - name: Run doc tests
        run: cargo test --doc

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: check
    if: inputs.coverage
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working_directory }}

      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ${{ inputs.working_directory }}/lcov.info
          fail_ci_if_error: false

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    if: inputs.deny
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ inputs.working_directory }}/Cargo.toml
