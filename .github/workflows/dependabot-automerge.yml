name: Dependency auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write
  statuses: write
  packages: read
concurrency:
  group: dep-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
  NODE_OPTIONS: --max-old-space-size=32768 --max-semi-space-size=256
  UV_THREADPOOL_SIZE: 32
  NODE_ENV: production
  NO_COLOR: true
defaults:
  run:
    shell: 'bash'
jobs:
  automerge:
    if: >-
      github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        if: github.actor == 'dependabot[bot]'
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - name: Auto-approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
