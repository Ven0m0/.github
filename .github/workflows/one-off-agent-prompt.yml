name: One-off Agent Prompt
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Which agent to run"
        required: true
        type: choice
        options:
          - claude
          - gemini
          - jules
          - opencode
          - kilo
      prompt:
        description: "One-off prompt to run"
        required: true
        type: string
      model:
        description: "Optional model override (supported by claude, gemini, opencode, kilo)"
        required: false
        default: ""
        type: string

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NOWARNINGS: "yes"
  NODE_NO_WARNINGS: "1"
  DO_NOT_TRACK: "1"
  GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
  GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

jobs:
  run-provider:
    name: "Run ${{ github.event.inputs.provider }}"
    # Jules requires ubuntu-slim; all other providers use ubuntu-latest
    runs-on: ${{ github.event.inputs.provider == 'jules' && 'ubuntu-slim' || 'ubuntu-latest' }}
    timeout-minutes: 59
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Jules needs full history for include_commit_log; others only need HEAD
          fetch-depth: ${{ github.event.inputs.provider == 'jules' && '0' || '1' }}
          persist-credentials: false

      - name: Configure git identity
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run agent
        uses: ./actions/run-agent-prompt
        with:
          provider: ${{ github.event.inputs.provider }}
          prompt: ${{ github.event.inputs.prompt }}
          model: ${{ github.event.inputs.model }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          jules-api-key: ${{ secrets.JULES_API_KEY }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          kilo-api-key: ${{ secrets.KILO_API_KEY }}
          kilo-org-id: ${{ secrets.KILO_ORG_ID }}
