# Bun Setup & Test Workflow (Reusable)
name: Bun Setup (Reusable)

on:
  workflow_call:
  inputs:
    bun-version:
      type: string
      default: latest
      description: 'Bun version to use'
    run-tests:
      type: boolean
      default: true
      description: 'Run test suite'
    run-lint:
      type: boolean
      default: true
      description: 'Run linting'
    run-typecheck:
      type: boolean
      default: true
      description: 'Run type checking'
    test-command:
      type: string
      default: bun test
      description: 'Command to run tests'
    lint-command:
      type: string
      default: bun run lint
      description: 'Command to run linting'
    typecheck-command:
      type: string
      default: bun run typecheck
      description: 'Command to run type checking'
  workflow_dispatch:
  pull_request:
  branches: [main, master]
  push:
  branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  LC_ALL: C

jobs:
  setup:
  name: Bun Setup & CI
  runs-on: ubuntu-slim
  timeout-minutes: 10
  steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 1

    - name: Check for Bun Dependencies
      id: check_files
      run: |
        if [[ -f "package.json" || -f "bun.lockb" ]]; then
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          echo "Bun dependency files found."
        else
          echo "has_files=false" >> "$GITHUB_OUTPUT"
          echo "No Bun dependency files found."
        fi
      shell: bash

    - name: Setup Bun
      if: steps.check_files.outputs.has_files == 'true'
      uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
      with:
        bun-version: ${{ inputs.bun-version || 'latest' }}

    - name: Cache Dependencies
      if: steps.check_files.outputs.has_files == 'true'
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install Dependencies
      if: steps.check_files.outputs.has_files == 'true'
      run: bun install --frozen-lockfile

    - name: Run Type Checking
      if: inputs.run-typecheck && steps.check_files.outputs.has_files == 'true'
      run: ${{ inputs.typecheck-command }}

    - name: Run Linting
      if: inputs.run-lint && steps.check_files.outputs.has_files == 'true'
      run: ${{ inputs.lint-command }}

    - name: Run Tests
      if: inputs.run-tests && steps.check_files.outputs.has_files == 'true'
      run: ${{ inputs.test-command }}
