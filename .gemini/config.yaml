# Config for the Gemini Pull Request Review Bot.
# https://github.com/marketplace/gemini-code-assist
$schema: "http://json-schema.org/draft-07/schema#"
have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: LOW
  max_review_comments: -1
  pull_request_opened:
  help: false
  summary: false
  code_review: true
  include_drafts: true
ignore_patterns: ["**/*.txt", "**/*.lock"]
