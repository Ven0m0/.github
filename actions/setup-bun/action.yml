# Composite Action: Setup Bun with Node.js
# Provides consistent Bun environment setup across all workflows
#
# Usage:
#   - uses: ./actions/setup-bun
#     with:
#       bun-version: 'latest'
#       node-version: '24'

name: 'Setup Bun'
description: 'Install Bun runtime with Node.js for development workflows'
author: 'Ven0m0'
branding:
  icon: 'zap'
  color: 'orange'
inputs:
  bun-version:
    description: 'Bun version to install'
    required: false
    default: 'latest'
  node-version:
    description: 'Node.js version to install alongside Bun'
    required: false
    default: '24'
outputs:
  bun-version:
    description: 'Installed Bun version'
    value: ${{ steps.bun-info.outputs.version }}
runs:
  using: 'composite'
  steps:
    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
        # bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        # bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install setuptools for distutils compatibility
      run: python3 -c "import setuptools" || python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      shell: bash
      run: |
        # Workaround for patched peer variants
        # e.g. ./patches/ for standard-openapi
        # https://github.com/oven-sh/bun/issues/28147
        if [[ "$RUNNER_OS" = "Windows" ]]; then
          bun install --linker hoisted
        else
          bun install
        fi

    - name: Get Bun version
      id: bun-info
      shell: bash
      run: |
        BUN_VERSION=$(bun --version)
        echo "version=$BUN_VERSION" >> "$GITHUB_OUTPUT"
        echo "Using Bun $BUN_VERSION"
