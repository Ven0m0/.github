# Composite Action: Run Agent Prompt
# Dispatch a one-off prompt to a specified AI agent provider.
#
# Usage:
#   - uses: ./actions/run-agent-prompt
#     with:
#       provider: claude        # claude | gemini | jules | opencode | kilo
#       prompt: "Fix the bug"
#       git-author-name: github-actions[bot]
#       git-author-email: 41898282+github-actions[bot]@users.noreply.github.com
#
# API keys can be passed as inputs OR set as env vars on the calling job/step.
# Inputs take precedence; env vars are the fallback.
#
# Expected env var names (when not passing as inputs):
#   ANTHROPIC_API_KEY, GEMINI_API_KEY, JULES_API_KEY,
#   OPENCODE_API_KEY, OPENROUTER_API_KEY, KILO_API_KEY, KILO_ORG_ID

name: "Run Agent Prompt"
description: "Dispatch a one-off prompt to a specified AI agent provider (Claude, Gemini, Jules, OpenCode, or Kilo)"
author: "Ven0m0"

branding:
  icon: "terminal"
  color: "purple"

inputs:
  provider:
    description: "AI agent provider: claude | gemini | jules | opencode | kilo"
    required: true
  prompt:
    description: "Prompt to send to the agent"
    required: true
  model:
    description: "Model override (supported by claude, gemini, opencode, kilo; ignored for jules)"
    required: false
    default: ""
  github-token:
    description: "GitHub token for provider authentication and repository access (falls back to env.GITHUB_TOKEN)"
    required: false
    default: ""
  git-author-name:
    description: "Git author name exposed to agent runs for repo-mutating prompts"
    required: false
    default: "github-actions[bot]"
  git-author-email:
    description: "Git author email exposed to agent runs for repo-mutating prompts"
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  git-committer-name:
    description: "Git committer name exposed to agent runs (defaults to git-author-name)"
    required: false
    default: ""
  git-committer-email:
    description: "Git committer email exposed to agent runs (defaults to git-author-email)"
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API key (falls back to env.ANTHROPIC_API_KEY)"
    required: false
    default: ""
  gemini-api-key:
    description: "Google Gemini API key (falls back to env.GEMINI_API_KEY)"
    required: false
    default: ""
  jules-api-key:
    description: "Jules API key (falls back to env.JULES_API_KEY)"
    required: false
    default: ""
  opencode-api-key:
    description: "OpenCode API key (falls back to env.OPENCODE_API_KEY)"
    required: false
    default: ""
  openrouter-api-key:
    description: "OpenRouter API key (falls back to env.OPENROUTER_API_KEY)"
    required: false
    default: ""
  kilo-api-key:
    description: "Kilo API key (falls back to env.KILO_API_KEY)"
    required: false
    default: ""
  kilo-org-id:
    description: "Kilo organization ID (falls back to env.KILO_ORG_ID)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        set -euo pipefail

        case "${{ inputs.provider }}" in
          claude|gemini|jules|opencode|kilo) ;;
          *)
            echo "::error::Unsupported provider '${{ inputs.provider }}'. Expected one of: claude, gemini, jules, opencode, kilo."
            exit 1
            ;;
        esac

        if [[ -n "${{ inputs.git-committer-name }}" && -z "${{ inputs.git-committer-email }}" ]] ||
          [[ -z "${{ inputs.git-committer-name }}" && -n "${{ inputs.git-committer-email }}" ]]; then
          echo "::error::git-committer-name and git-committer-email must either both be set or both be blank."
          exit 1
        fi

    - name: Warn about unsupported Jules model override
      if: ${{ inputs.provider == 'jules' && inputs.model != '' }}
      shell: bash
      run: echo "::warning::Jules does not expose a model override; the provided model input will be ignored."

    - name: Run Claude
      if: ${{ inputs.provider == 'claude' }}
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key || env.ANTHROPIC_API_KEY }}
        github_token: ${{ inputs.github-token || env.GITHUB_TOKEN }}
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
      env:
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
        CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
        CLAUDE_CODE_ENABLE_TELEMETRY: "0"
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
        CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        ENABLE_TOOL_SEARCH: "1"
        ENABLE_LSP_TOOL: "1"
        USE_BUILTIN_RIPGREP: "1"
        CLAUDE_CODE_ENABLE_TASKS: "true"

    - name: Run Gemini
      if: ${{ inputs.provider == 'gemini' }}
      uses: google-github-actions/run-gemini-cli@642deeb7a3882dd77c38a4722127700890330067
      env:
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
        GITHUB_TOKEN: ${{ inputs.github-token || env.GITHUB_TOKEN }}
      with:
        gemini_api_key: ${{ inputs.gemini-api-key || env.GEMINI_API_KEY }}
        gemini_model: ${{ inputs.model }}
        prompt: ${{ inputs.prompt }}

    - name: Run Jules
      if: ${{ inputs.provider == 'jules' }}
      uses: BeksOmega/jules-action@v1.0.0
      env:
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
      with:
        prompt: ${{ inputs.prompt }}
        jules_api_key: ${{ inputs.jules-api-key || env.JULES_API_KEY }}
        include_commit_log: true

    - name: Run OpenCode
      if: ${{ inputs.provider == 'opencode' }}
      # v1.3.3
      uses: anomalyco/opencode/github@54443bfb7e090ec3130dc972e689a3e5cc55a7f9
      env:
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key || env.ANTHROPIC_API_KEY }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key || env.OPENCODE_API_KEY }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key || env.OPENROUTER_API_KEY }}
        OPENCODE_EXPERIMENTAL: "true"
        OPENCODE_EXPERIMENTAL_MARKDOWN: "true"
        OPENCODE_ENABLE_EXPERIMENTAL_MODELS: "true"
        OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS: "20000"
        OPENCODE_EXPERIMENTAL_LAZY_TOOLS: "true"
        OPENCODE_PRUNE_SCALE_WITH_CONTEXT: "true"
        OPENCODE_DISABLE_FILETIME_CHECK: "true"
        OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: "true"
        OPENCODE_DISABLE_AUTOUPDATE: "true"
        OPENCODE_EXPERIMENTAL_OXFMT: "true"
        MORPH_TIMEOUT: "60000"
        MORPH_MODEL: morph-v3-fast
        GITHUB_TOKEN: ${{ inputs.github-token || env.GITHUB_TOKEN }}
      with:
        model: ${{ inputs.model != '' && inputs.model || 'openrouter/auto:exacto:online' }}
        prompt: ${{ inputs.prompt }}
        use_github_token: true

    - name: Resolve Kilo asset metadata
      if: ${{ inputs.provider == 'kilo' }}
      id: kilo-asset
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || env.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) asset_name="kilo-linux-x64-baseline.tar.gz" ;;
          Linux/ARM64) asset_name="kilo-linux-arm64.tar.gz" ;;
          macOS/X64) asset_name="kilo-darwin-x64-baseline.zip" ;;
          macOS/ARM64) asset_name="kilo-darwin-arm64.zip" ;;
          Windows/X64) asset_name="kilo-windows-x64-baseline.zip" ;;
          Windows/ARM64) asset_name="kilo-windows-arm64.zip" ;;
          *)
            echo "::error::Unsupported runner for Kilo: ${RUNNER_OS}/${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        release_json="$(mktemp)"
        curl -fsSL \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/Kilo-Org/kilocode/releases/latest \
          -o "$release_json"

        python3 - "$release_json" "$asset_name" <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import sys

        release_path, asset_name = sys.argv[1:3]
        with open(release_path, encoding="utf-8") as handle:
            data = json.load(handle)

        version = data.get("tag_name", "<unknown>")
        asset = next((item for item in data.get("assets", []) if item.get("name") == asset_name), None)
        if asset is None:
            sys.stderr.write(f"Missing asset {asset_name} in Kilo release {version}\n")
            sys.exit(1)

        digest = asset.get("digest", "")
        if not digest.startswith("sha256:"):
            sys.stderr.write(f"Missing sha256 digest for Kilo asset {asset_name} in release {version}\n")
            sys.exit(1)

        print(f"asset_name={asset_name}")
        print(f"asset_url={asset['browser_download_url']}")
        print(f"asset_sha256={digest.removeprefix('sha256:')}")
        PY

    - name: Install Kilo CLI
      if: ${{ inputs.provider == 'kilo' }}
      shell: bash
      env:
        ASSET_NAME: ${{ steps.kilo-asset.outputs.asset_name }}
        ASSET_URL: ${{ steps.kilo-asset.outputs.asset_url }}
        ASSET_SHA256: ${{ steps.kilo-asset.outputs.asset_sha256 }}
      run: |
        set -euo pipefail

        tmp_dir="$(mktemp -d)"
        asset_path="$tmp_dir/$ASSET_NAME"
        export ASSET_SHA256 asset_path tmp_dir

        curl -fsSL "$ASSET_URL" -o "$asset_path"

        python3 - <<'PY'
        import hashlib
        import os
        import pathlib
        import shutil
        import sys
        import tarfile
        import zipfile

        asset_path = pathlib.Path(os.environ["asset_path"])
        extract_dir = pathlib.Path(os.environ["tmp_dir"]) / "extract"
        expected_sha256 = os.environ["ASSET_SHA256"]
        destination_dir = pathlib.Path.home() / ".kilo" / "bin"

        actual_sha256 = hashlib.sha256(asset_path.read_bytes()).hexdigest()
        if actual_sha256 != expected_sha256:
            sys.stderr.write(
                f"SHA256 mismatch for {asset_path.name}: expected {expected_sha256}, got {actual_sha256}\n"
            )
            sys.exit(1)

        extract_dir.mkdir(parents=True, exist_ok=True)
        if tarfile.is_tarfile(asset_path):
            with tarfile.open(asset_path, "r:*") as archive:
                archive.extractall(extract_dir)
        elif zipfile.is_zipfile(asset_path):
            with zipfile.ZipFile(asset_path) as archive:
                archive.extractall(extract_dir)
        else:
            sys.stderr.write(f"Unsupported Kilo archive format: {asset_path.name}\n")
            sys.exit(1)

        binary = next(
            (candidate for candidate in extract_dir.rglob("*") if candidate.is_file() and candidate.name in {"kilo", "kilo.exe"}),
            None,
        )
        if binary is None:
            sys.stderr.write("Unable to locate Kilo binary in extracted archive\n")
            sys.exit(1)

        destination_dir.mkdir(parents=True, exist_ok=True)
        destination = destination_dir / binary.name
        shutil.copy2(binary, destination)
        destination.chmod(destination.stat().st_mode | 0o755)
        PY

    - name: Add Kilo to PATH
      if: ${{ inputs.provider == 'kilo' }}
      shell: bash
      run: echo "$HOME/.kilo/bin" >> "$GITHUB_PATH"

    - name: Run Kilo
      if: ${{ inputs.provider == 'kilo' }}
      shell: bash
      run: kilo github run
      env:
        MODEL: ${{ inputs.model != '' && inputs.model || 'kilo/kilo-auto/frontier' }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: "true"
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
        GITHUB_TOKEN: ${{ inputs.github-token || env.GITHUB_TOKEN }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key || env.OPENCODE_API_KEY }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key || env.OPENROUTER_API_KEY }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key || env.ANTHROPIC_API_KEY }}
        KILO_API_KEY: ${{ inputs.kilo-api-key || env.KILO_API_KEY }}
        KILO_ORG_ID: ${{ inputs.kilo-org-id || env.KILO_ORG_ID }}
        OPENCODE_EXPERIMENTAL: "true"
        OPENCODE_EXPERIMENTAL_MARKDOWN: "true"
        OPENCODE_ENABLE_EXPERIMENTAL_MODELS: "true"
        OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS: "20000"
        OPENCODE_EXPERIMENTAL_LAZY_TOOLS: "true"
        OPENCODE_PRUNE_SCALE_WITH_CONTEXT: "true"
        OPENCODE_DISABLE_FILETIME_CHECK: "true"
        OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: "true"
        OPENCODE_DISABLE_AUTOUPDATE: "true"
        OPENCODE_EXPERIMENTAL_OXFMT: "true"
        MORPH_TIMEOUT: "60000"
        MORPH_MODEL: morph-v3-fast
