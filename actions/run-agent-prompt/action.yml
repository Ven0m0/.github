name: "Run Agent Prompt"
description: "Dispatch a one-off prompt to a specified AI agent provider (claude | gemini | jules | opencode | kilo)"
author: "Ven0m0"

branding:
  icon: "terminal"
  color: "purple"

inputs:
  provider:
    description: "claude | gemini | opencode | kilo"
    required: true
  prompt:
    description: "Prompt to send to the agent"
    required: true
  model:
    description: "Model override"
    required: false
    default: ""
  github-token:
    description: "GitHub token (falls back to env.GITHUB_TOKEN)"
    required: false
    default: ""
  git-author-name:
    required: false
    default: "github-actions[bot]"
  git-author-email:
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  git-committer-name:
    required: false
    default: ""
  git-committer-email:
    required: false
    default: ""
  anthropic-api-key:
    required: false
    default: ""
  gemini-api-key:
    required: false
    default: ""
  opencode-api-key:
    required: false
    default: ""
  openrouter-api-key:
    required: false
    default: ""
  kilo-api-key:
    required: false
    default: ""
  kilo-org-id:
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Validate provider
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email }}
      run: |
        case "$PROVIDER" in
          claude|gemini|opencode|kilo) ;;
          *) echo "::error::Unsupported provider '$PROVIDER'. Expected: claude | gemini | opencode | kilo"; exit 1 ;;
        esac
        if [[ (-n "$GIT_COMMITTER_NAME" && -z "$GIT_COMMITTER_EMAIL") || (-z "$GIT_COMMITTER_NAME" && -n "$GIT_COMMITTER_EMAIL") ]]; then
          echo "::error::git-committer-name and git-committer-email must both be set or both be blank."
          exit 1
        fi

    - name: Configure git identity
      shell: bash
      env:
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
      run: |
        git config --local user.name "$GIT_AUTHOR_NAME"
        git config --local user.email "$GIT_AUTHOR_EMAIL"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        activate-environment: true
        ignore-nothing-to-cache: true
        ignore-empty-workdir: true

    - name: Install GitHub CLI
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        if command -v gh >/dev/null 2>&1; then
          echo "GitHub CLI (gh) is already installed."
          exit 0
        fi
        if command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends gh
        else
          echo "::warning::GitHub CLI (gh) is not installed and automatic installation is only supported on Debian/Ubuntu (apt-get not found). Skipping installation."
        fi
    - name: Cache npm downloads
      if: ${{ inputs.provider == 'claude' || inputs.provider == 'opencode' || inputs.provider == 'kilo' }}
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-agent-lsp-npm-${{ hashFiles('actions/run-agent-prompt/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-agent-lsp-npm-
    - name: Install LSP servers
      if: ${{ inputs.provider == 'claude' || inputs.provider == 'opencode' || inputs.provider == 'kilo' }}
      shell: bash
      env:
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_FUND: "false"
      run: |
        uv tool install basedpyright
        npm install -g @zed-industries/vscode-langservers-extracted yaml-language-server @vtsls/language-server typescript bash-language-server tombi 2>/dev/null || true 

    - name: Run Claude
      if: ${{ inputs.provider == 'claude' }}
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key || env.ANTHROPIC_API_KEY }}
        github_token: ${{ inputs.github-token || env.GITHUB_TOKEN }}
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
      env:
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
        CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
        CLAUDE_CODE_ENABLE_TELEMETRY: "0"
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
        CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        ENABLE_TOOL_SEARCH: "1"
        ENABLE_LSP_TOOL: "1"
        USE_BUILTIN_RIPGREP: "1"
        CLAUDE_CODE_ENABLE_TASKS: "true"

    - name: Run Gemini
      if: ${{ inputs.provider == 'gemini' }}
      uses: google-github-actions/run-gemini-cli@v0.1.22
      with:
        gemini_api_key: ${{ inputs.gemini-api-key || env.GEMINI_API_KEY }}
        gemini_model: ${{ inputs.model }}
        prompt: ${{ inputs.prompt }}
      env:
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
        GITHUB_TOKEN: ${{ inputs.github-token || env.GITHUB_TOKEN }}

    - name: Run OpenCode
      if: ${{ inputs.provider == 'opencode' }}
      uses: anomalyco/opencode/github@v1.18.18
      with:
        model: ${{ inputs.model != '' && inputs.model || 'opencode/minimax-m2.5-free' }}
        prompt: ${{ inputs.prompt }}
        use_github_token: true
      env:
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key || env.ANTHROPIC_API_KEY }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key || env.OPENCODE_API_KEY }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key || env.OPENROUTER_API_KEY }}
        GITHUB_TOKEN: ${{ inputs.github-token || env.GH_TOKEN || env.GITHUB_TOKEN }}
        OPENCODE_ENABLE_EXA: "1"
        OPENCODE_EXPERIMENTAL: "true"
        OPENCODE_EXPERIMENTAL_LSP_TOOL: "true"
        OPENCODE_EXPERIMENTAL_MARKDOWN: "true"
        OPENCODE_ENABLE_EXPERIMENTAL_MODELS: "true"
        OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS: "20000"
        OPENCODE_EXPERIMENTAL_LAZY_TOOLS: "true"
        OPENCODE_PRUNE_SCALE_WITH_CONTEXT: "true"
        OPENCODE_DISABLE_FILETIME_CHECK: "true"
        OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: "1"
        OPENCODE_DISABLE_AUTOUPDATE: "true"
        OPENCODE_EXPERIMENTAL_OXFMT: "true"
        MORPH_TIMEOUT: "60000"
        MORPH_MODEL: morph-v3-fast

    - name: Get Kilo version
      if: ${{ inputs.provider == 'kilo' }}
      id: kilo-version
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || env.GITHUB_TOKEN }}
      run: |
        VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Kilo-Org/kilocode/releases/latest | grep '"tag_name":' | head -n 1 | sed -E 's/.*"tag_name":\s*"([^"]+)".*/\1/')
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Cache Kilo
      if: ${{ inputs.provider == 'kilo' }}
      id: kilo-cache
      uses: actions/cache@v6
      with:
        path: ~/.kilo/bin
        key: kilo-${{ runner.os }}-${{ runner.arch }}-${{ steps.kilo-version.outputs.version }}
    - name: Install Kilo
      if: ${{ inputs.provider == 'kilo' && steps.kilo-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        curl -fsSL https://kilo.ai/cli/install | bash
        echo "$HOME/.kilo/bin" >> $GITHUB_PATH
    - name: Run Kilo
      if: ${{ inputs.provider == 'kilo' }}
      shell: bash
      run: kilo github run
      env:
        MODEL: ${{ inputs.model != '' && inputs.model || 'kilo/minimax/minimax-m2.5:free' }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: "true"
        GIT_AUTHOR_NAME: ${{ inputs.git-author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-committer-name || inputs.git-author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-committer-email || inputs.git-author-email }}
        GITHUB_TOKEN: ${{ inputs.github-token || env.GITHUB_TOKEN }}
        KILO_API_KEY: ${{ inputs.kilo-api-key || env.KILO_API_KEY }}
        KILO_ORG_ID: ${{ inputs.kilo-org-id || env.KILO_ORG_ID }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key || env.ANTHROPIC_API_KEY }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key || env.OPENCODE_API_KEY }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key || env.OPENROUTER_API_KEY }}
        OPENCODE_ENABLE_EXA: "1"
        OPENCODE_EXPERIMENTAL: "true"
        OPENCODE_EXPERIMENTAL_LSP_TOOL: "true"
        OPENCODE_EXPERIMENTAL_MARKDOWN: "true"
        OPENCODE_ENABLE_EXPERIMENTAL_MODELS: "true"
        OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS: "20000"
        OPENCODE_EXPERIMENTAL_LAZY_TOOLS: "true"
        OPENCODE_PRUNE_SCALE_WITH_CONTEXT: "true"
        OPENCODE_DISABLE_FILETIME_CHECK: "true"
        OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: "1"
        OPENCODE_DISABLE_AUTOUPDATE: "true"
        OPENCODE_EXPERIMENTAL_OXFMT: "true"
        MORPH_TIMEOUT: "60000"
        MORPH_MODEL: morph-v3-fast
