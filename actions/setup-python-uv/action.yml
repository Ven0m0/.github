# Composite Action: Setup Python with uv
# Provides consistent Python environment setup across all workflows
# Backwards-compatible wrapper around setup-uv that preserves non-frozen dependency installs.
#
# Usage:
#   - uses: ./actions/setup-python-uv
#     with:
#       python-version: '3.12'

name: "Setup Python with uv"
description: "Install Python and uv package manager with caching"
author: "Ven0m0"

branding:
  icon: "package"
  color: "blue"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  install-dependencies:
    description: "Install dependencies after setup"
    required: false
    default: "true"
  extras:
    description: "Set to install all extras; disabled only when set to false, 0, no, or off"
    required: false
    default: ""
  working-directory:
    description: "Working directory for commands"
    required: false
    default: "."

outputs:
  python-version:
    description: "Installed Python version"
    value: ${{ steps.python.outputs.version }}
  uv-version:
    description: "Installed uv version"
    value: ${{ steps.uv-version.outputs.version }}
  cache-hit:
    description: "Whether the cache was hit"
    value: ${{ steps.uv.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      id: uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"

    - name: Set up Python
      id: python
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: ${{ github.action_path }}/../setup-uv/scripts/install-python.sh

    - name: Get uv version
      id: uv-version
      shell: bash
      run: ${{ github.action_path }}/../setup-uv/scripts/write-uv-version.sh

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTRAS: ${{ inputs.extras }}
        FROZEN: "false"
      run: ${{ github.action_path }}/../setup-uv/scripts/sync-dependencies.sh
