# Composite Action: Setup Python with uv
# Provides consistent Python environment setup across all workflows
#
# Usage:
#   - uses: ./actions/setup-uv
#     with:
#       python-version: '3.12'
#       frozen: 'true'

name: "Setup Python with uv"
description: "Install Python and uv package manager with caching"
author: "zircote"
branding:
  icon: "package"
  color: "blue"
inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  install-dependencies:
    description: "Install dependencies after setup"
    required: false
    default: "true"
  extras:
    description: "Set to install all extras; disabled only when set to false, 0, no, or off"
    required: false
    default: ""
  frozen:
    description: "Whether to require uv.lock to be up to date during dependency installation"
    required: false
    default: "true"
  working-directory:
    description: "Working directory for commands"
    required: false
    default: "."
outputs:
  python-version:
    description: "Installed Python version"
    value: ${{ steps.python.outputs.version }}
  uv-version:
    description: "Installed uv version"
    value: ${{ steps.uv-version.outputs.version }}
  cache-hit:
    description: "Whether the cache was hit"
    value: ${{ steps.uv.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    - name: Install uv
      id: uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"
    - name: Set up Python
      id: python
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: ${{ github.action_path }}/scripts/install-python.sh
    - name: Get uv version
      id: uv-version
      shell: bash
      run: ${{ github.action_path }}/scripts/write-uv-version.sh
    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTRAS: ${{ inputs.extras }}
        FROZEN: ${{ inputs.frozen }}
      run: ${{ github.action_path }}/scripts/sync-dependencies.sh
