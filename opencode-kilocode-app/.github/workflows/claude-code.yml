name: OpenCode Kilocode Action

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider (opencode, kilo)"
        required: true
        default: "opencode"
        type: choice
        options:
          - opencode
          - kilo
      prompt:
        description: "Prompt for the agent"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  claude-code:
    if: >-
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/kilo'))) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '/opencode') || contains(github.event.issue.body, '/kilo'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine Provider and Prompt
        id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROVIDER: ${{ github.event.inputs.provider }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
         run: |
           PROVIDER="opencode"
           PROMPT=""

           if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
             PROVIDER="$INPUT_PROVIDER"
             PROMPT="$INPUT_PROMPT"
           elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
             PROMPT="$COMMENT_BODY"
             if [[ "$PROMPT" == *"/opencode"* ]]; then PROVIDER="opencode"; fi
             if [[ "$PROMPT" == *"/kilo"* ]]; then PROVIDER="kilo"; fi
           elif [[ "$EVENT_NAME" == "issues" ]]; then
             PROMPT="$ISSUE_BODY"
             if [[ "$PROMPT" == *"/opencode"* ]]; then PROVIDER="opencode"; fi
             if [[ "$PROMPT" == *"/kilo"* ]]; then PROVIDER="kilo"; fi
           fi

          {
            echo "provider=$PROVIDER"
            echo "prompt<<EOF"
            echo "$PROMPT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"



      - name: Run OpenCode
        if: steps.config.outputs.provider == 'opencode'
        uses: anomalyco/opencode/github@v1.17.7
        with:
          prompt: ${{ steps.config.outputs.prompt }}
          use_github_token: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kilocode
        if: steps.config.outputs.provider == 'kilo'
        shell: bash
        run: |
          curl -fsSL https://kilo.ai/cli/install | bash
          echo "$HOME/.kilo/bin" >> "$GITHUB_PATH"

      - name: Run Kilocode
        if: steps.config.outputs.provider == 'kilo'
        shell: bash
        run: kilo github run
        env:
          PROMPT: ${{ steps.config.outputs.prompt }}
          USE_GITHUB_TOKEN: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}


