# Standalone ruff configuration
# Copy to project root as ruff.toml
# For pyproject.toml users, use [tool.ruff] section instead

target-version = "py311"
line-length = 88
indent-width = 2
fix = true
src = ["src", "tests"]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

[lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "UP",    # pyupgrade
  "ARG",   # flake8-unused-arguments
  "SIM",   # flake8-simplify
  "TCH",   # flake8-type-checking
  "PTH",   # flake8-use-pathlib
  "ERA",   # eradicate
  "PL",    # pylint
  "RUF",   # ruff-specific
  "PERF",  # perflint
  "S",     # flake8-bandit (security)
  "N",     # pep8-naming
]
ignore = [
  "E501",    # line too long
  "PLR0913", # too many arguments
  "PLR2004", # magic value comparison
  "S101",    # use of assert
  "COM812",  # missing trailing comma
  "ISC001",  # single line concat
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004"]
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["my_project"]
force-single-line = false
lines-after-imports = 2

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
