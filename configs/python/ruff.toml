target-version = "py312"
line-length = 88
indent-width = 2
fix = true

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH", "PTH", "RUF", "PERF", "S"]
ignore = ["E501", "S101", "COM812", "ISC001"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004"]

[lint.isort]
force-single-line = false

[format]
quote-style = "double"
line-ending = "lf"
